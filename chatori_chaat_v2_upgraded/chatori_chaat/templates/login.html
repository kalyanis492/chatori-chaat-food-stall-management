<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login – Chatori Chaat</title>
  <link rel="icon" type="image/png" href="/static/images/logo.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--saffron:#FF6B00;--turmeric:#FFB800;--dark:#1A0A00;}
    *{box-sizing:border-box;font-family:'Poppins',sans-serif;}
    body{min-height:100vh;background:linear-gradient(135deg,var(--dark) 0%,#3D1A00 100%);display:flex;align-items:center;justify-content:center;padding:20px;}
    .login-card{background:white;border-radius:24px;overflow:hidden;max-width:420px;width:100%;box-shadow:0 24px 64px rgba(0,0,0,0.4);}
    .login-header{background:linear-gradient(135deg,var(--saffron),var(--turmeric));padding:2.5rem 2rem;text-align:center;color:white;}
    .login-body{padding:2rem;}
    .form-control:focus{border-color:var(--saffron);box-shadow:0 0 0 3px rgba(255,107,0,0.15);outline:none;}
    .form-control{border-radius:10px;border:1.5px solid #e0e0e0;padding:10px 14px;}
    .btn-login{background:linear-gradient(135deg,var(--saffron),#FF4500);border:none;color:white;font-weight:700;padding:13px;border-radius:50px;width:100%;transition:all 0.3s;font-size:1rem;}
    .btn-login:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(255,107,0,0.4);color:white;}
    label{font-weight:600;font-size:0.875rem;color:#444;margin-bottom:6px;display:block;}
    .input-group-text{background:white;border:1.5px solid #e0e0e0;border-right:none;}
    .input-group .form-control{border-left:none;}
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-header">
      <img src="/static/images/logo.png" alt="Chatori Chaat" class="login-logo-img mb-3"
           style="width:90px;height:90px;object-fit:cover;border-radius:50%;border:3px solid rgba(255,255,255,0.4);">
      <h4 class="fw-bold mb-0">Admin Panel</h4>
      <small class="opacity-75">Chatori Chaat Management System</small>
    </div>
    <div class="login-body">
      {% if error %}
      <div class="alert alert-danger rounded-3 small mb-3"><i class="fas fa-exclamation-circle me-2"></i>{{ error }}</div>
      {% endif %}
      <form method="POST" action="/login">
        <div class="mb-3">
          <label>Username</label>
          <div class="input-group">
            <span class="input-group-text"><i class="fas fa-user text-muted"></i></span>
            <input type="text" name="username" class="form-control" placeholder="Enter username" required autofocus>
          </div>
        </div>
        <div class="mb-4">
          <label>Password</label>
          <div class="input-group">
            <span class="input-group-text"><i class="fas fa-lock text-muted"></i></span>
            <input type="password" name="password" class="form-control" placeholder="Enter password" required>
          </div>
        </div>
        <button type="submit" class="btn btn-login"><i class="fas fa-sign-in-alt me-2"></i>Login to Admin Panel</button>
      </form>
      <div class="text-center mt-3">
        <a href="/" class="text-muted small text-decoration-none"><i class="fas fa-arrow-left me-1"></i>Back to Website</a>
      </div>
    </div>
  </div>
</body>
</html>
